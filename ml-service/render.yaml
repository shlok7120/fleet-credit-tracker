# Render deployment for the ML microservice.
# Render reads this automatically when you connect the repo as a Blueprint.
services:
  - type: web
    name: fleet-ml-service
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: "pip install -r requirements.txt && python train.py"
    # Render supplies $PORT; binding to it is mandatory or the deploy fails.
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
